# Example configuration: DKIM keys without rspamd (openssl dkim
# handler) combined with an OpenDKIM signing service.
#
# The openssl dkim handler generates the key pair locally (no rspamd,
# no sudo). The opendkim service handler generates KeyTable and
# SigningTable entries for every domain referencing the dkim section
# and reloads opendkim (set reload=false if opendkim runs on another
# host or inside a container).

[cdm]
statedir=/tmp/cdm_test

[domain]
handler=dnsuptools/inwx

[domain:test.entroserv.de]
dkim.mydkim=auto

[dkim]
handler=openssl
keysize=2048

[dkim:mydkim]
keybasename=key
keyname=dkimfile.key
keylocation=/var/lib/opendkim/keys

[service:opendkim]
handler=opendkim
dkim=mydkim
keytablefile=/etc/opendkim/KeyTable
signingtablefile=/etc/opendkim/SigningTable
reload=true
