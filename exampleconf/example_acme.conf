# Example configuration: certificates via the acme handler
# (acme library, see cryptdomainmgr/modules/cert/handleracme.py)
# using the LetsEncrypt staging environment.
#
# Staging issues certificates with untrusted test roots - use it to test
# your setup without hitting the production rate limits. For production
# remove the "ca" line (or leave it out to use the default LetsEncrypt
# production directory).
#
# The dns-01 challenge tokens are published through the same domain
# handler mechanism as with the dehydrated handler.
#
# "waitsec" (optional, default 9) sets the DNS propagation wait in
# seconds before the challenge is answered; on validation failure the
# handler retries with a fresh order and x3 wait (9 s -> 27 s -> 81 s).
# Note: the domain must be publicly delegated, otherwise the validation
# server can never see the challenge records (NXDOMAIN).

[cdm]
statedir=/tmp/cdm_test

[domain]
handler=dnsuptools/inwx

[domain:test.entroserv.de]
cert=mycert
tlsa.tcp.443=auto:3:1:1

[cert]
handler=acme
email=stefan.helmert@t-online.de
keysize=4096
ca=https://acme-staging-v02.api.letsencrypt.org/directory

[cert:mycert]
destination=/home/stefan/projects/docker-traefik-cdm/configuration/files/
